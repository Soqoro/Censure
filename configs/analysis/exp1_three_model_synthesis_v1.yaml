limitations:
  - >-
    Outcomes from all three actors were inspected before this synthesis was frozen. Actor-specific
    within-study estimates retain their original inferential status, but every new cross-model
    contrast in this synthesis is retrospective and exploratory.
  - >-
    The synthesis combines a post-hoc partial analysis of two actors from exp1_full_v2 with a
    separately prospective Ministral breadth extension. It does not complete the original
    preregistered actor matrix.
  - >-
    Complete-case contrasts condition on joint successful execution. Sensitivity contrasts and
    sharp all-pair binary-harm bounds must be shown beside them.
  - >-
    Unsafe-attempt, block, call-count, guard-dependence, and degradation results are descriptive
    mechanism evidence and are not causal mediation estimates.
  - >-
    Pairwise actor-by-guard contrast intervals are unadjusted for three exploratory comparisons;
    actor-specific effects, not a pooled average or actor ranking, are the primary presentation.
